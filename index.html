<script>
const CHROMATIC = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

let songs = JSON.parse(localStorage.getItem('sslim_songs')) || [
{ id: 's1', title: 'Way Maker', singer: 'Sinach / Leeland', originalKey: 'G', tempo: 'Slow (68 BPM)', lyrics: '[G] You are here, moving in our [D] midst\nI worship [A] You, I worship [Bm] You\n\n[G] Way Maker, Miracle Worker, Promise [D] Keeper\nLight in the darkness, my [A] God, that is who You [Bm] are' },
{ id: 's2', title: 'Goodness of God', singer: 'Bethel Music', originalKey: 'A', tempo: 'Mid (70 BPM)', lyrics: '[A] I love You Lord, Oh Your mercy [D] never fails [A] me\n[E/G#] All my [F#m] days, I\'ve been [D] held in Your [E] hands\n\n[D] All my life You have been [A] faithful\n[D] All my life You have been [A] so, so [E] good' },
{ id: 's3', title: 'Build My Life', singer: 'Housefires', originalKey: 'G', tempo: 'Mid (68 BPM)', lyrics: '[G] Worthy of every [C/G] song we could ever sing\n[G/B] Worthy of all the [C] praise we could ever bring' }
];

let lineups = JSON.parse(localStorage.getItem('sslim_lineups')) || [
{ id: 'l1', date: '2025-02-16', leader: 'Sarah Jenkins', title: 'Sunday Morning Worship', notes: 'Focus on God\'s faithfulness.', songIds: ['s1', 's2', 's3'], transpositions: {} }
];

let songTranspositions = {};
let activeTabState = 'home';
let expandedSongId = null;
let editingLineupId = null;
let lineupDraftSongIds = [];

let currentStageLineup = null;
let currentStageSongIdx = 0;
let stageTranspositions = {};
let showStageChords = true;

const SHARED_API_URL = 'https://sslim.eunicelardizabal30.workers.dev';
const SYNC_INTERVAL_MS = 10000;
let sharedFileSha = null;
let syncTimer = null;
let syncSaveTimer = null;
let syncInProgress = false;
let syncDirty = false;
let lastRemoteUpdatedAt = null;

function setSyncStatus(message, state = 'normal') {
    const el = document.getElementById('sync-status');
    if (!el) return;
    el.textContent = message;
    el.title = message;
    el.className = state === 'error' ? 'text-red-300' : state === 'ok' ? 'text-emerald-300' : 'text-cyan-300';
}

function saveLocalBackup() {
    localStorage.setItem('sslim_songs', JSON.stringify(songs));
    localStorage.setItem('sslim_lineups', JSON.stringify(lineups));
}

function saveData() {
    saveLocalBackup();
    syncDirty = true;
    clearTimeout(syncSaveTimer);
    syncSaveTimer = setTimeout(pushSharedData, 600);
    setSyncStatus('Changes waiting to sync…');
}

function getWritePassword() {
    let password = sessionStorage.getItem('sslim_shared_write_password');
    if (!password) {
        password = prompt('Enter the SSLIM team shared editing password:');
        if (!password) return null;
        sessionStorage.setItem('sslim_shared_write_password', password);
    }
    return password;
}

async function fetchSharedData() {
    const response = await fetch(`${SHARED_API_URL}/api/data`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`Shared data could not be loaded (HTTP ${response.status}).`);
    return response.json();
}

function refreshVisibleView() {
    if (activeTabState === 'home') renderHome();
    if (activeTabState === 'songs') renderSongsBank();
    if (activeTabState === 'lineup') renderLineupsView();
    if (window.lucide) lucide.createIcons();
}

function isEditingOrPresenting() {
    return ['song-modal', 'lineup-modal', 'presentation-modal'].some(id => {
        const el = document.getElementById(id);
        return el && !el.classList.contains('hidden');
    });
}

async function loadSharedData({ silent = false } = {}) {
    try {
        const result = await fetchSharedData();
        if (result.exists && result.data) {
            const changed = result.sha !== sharedFileSha;
            if (changed) {
                songs = Array.isArray(result.data.songs) ? result.data.songs : [];
                lineups = Array.isArray(result.data.lineups) ? result.data.lineups : [];
                sharedFileSha = result.sha || null;
                lastRemoteUpdatedAt = result.updatedAt || null;
                saveLocalBackup();
                if (!isEditingOrPresenting()) refreshVisibleView();
            }
        } else {
            sharedFileSha = null;
        }
        setSyncStatus('Cloud synced · checks every 10s', 'ok');
        return true;
    } catch (error) {
        setSyncStatus('Cloud unavailable · using local copy', 'error');
        if (!silent) console.warn('SSLIM cloud sync:', error);
        return false;
    }
}

async function pushSharedData() {
    if (!syncDirty || syncInProgress) return;
    if (SHARED_API_URL.includes('YOUR-WORKER-NAME')) {
        setSyncStatus('Set Worker URL to enable cloud sync', 'error');
        return;
    }
    const password = getWritePassword();
    if (!password) {
        setSyncStatus('Cloud save cancelled', 'error');
        return;
    }
    syncInProgress = true;
    const snapshot = { songs: structuredClone(songs), lineups: structuredClone(lineups), baseSha: sharedFileSha };
    setSyncStatus('Saving to GitHub…');
    try {
        const response = await fetch(`${SHARED_API_URL}/api/data`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-App-Password': password },
            body: JSON.stringify(snapshot)
        });
        const result = await response.json().catch(() => ({}));
        if (response.status === 401) {
            sessionStorage.removeItem('sslim_shared_write_password');
            throw new Error('Incorrect editing password. Save again to re-enter it.');
        }
        if (response.status === 409) {
            await loadSharedData({ silent: true });
            syncDirty = false;
            throw new Error('Another user updated the shared file at the same time. The latest shared copy has been loaded; please reapply your change and save again.');
        }
        if (!response.ok) throw new Error(result.error || `Cloud save failed (HTTP ${response.status}).`);
        sharedFileSha = result.sha || sharedFileSha;
        lastRemoteUpdatedAt = result.updatedAt || null;
        syncDirty = false;
        saveLocalBackup();
        setSyncStatus('All changes synced', 'ok');
    } catch (error) {
        setSyncStatus('Cloud save failed · local copy kept', 'error');
        alert(error.message);
    } finally {
        syncInProgress = false;
        if (syncDirty) {
            clearTimeout(syncSaveTimer);
            syncSaveTimer = setTimeout(pushSharedData, 1000);
        }
    }
}

function startSharedSync() {
    if (SHARED_API_URL.includes('YOUR-WORKER-NAME')) {
        setSyncStatus('Set Worker URL to enable cloud sync', 'error');
        return;
    }
    loadSharedData().finally(() => {
        clearInterval(syncTimer);
        syncTimer = setInterval(() => {
            if (!syncDirty && !syncInProgress && !isEditingOrPresenting()) {
                loadSharedData({ silent: true });
            }
        }, SYNC_INTERVAL_MS);
    });
}

function switchTab(tab) {
    activeTabState = tab;
    ['home', 'songs', 'lineup'].forEach(t => {
        const tabEl = document.getElementById(`tab-${t}`);
        if (tabEl) {
            if (t === tab) tabEl.classList.remove('hidden');
            else tabEl.classList.add('hidden');
        }
        const nav = document.getElementById(`nav-${t}`);
        if (nav) {
            nav.className = t === tab ? 'flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50';
        }
        const bm = document.getElementById(`bm-${t}`);
        if (bm) {
            bm.className = t === tab ? 'flex flex-col items-center py-1 px-3 text-cyan-400' : 'flex flex-col items-center py-1 px-3 text-slate-400';
        }
    });
    if (tab === 'home') renderHome();
    if (tab === 'songs') renderSongsBank();
    if (tab === 'lineup') renderLineupsView();
    if (window.lucide) lucide.createIcons();
}

function transposeChord(chord, semitones) {
    if (!chord || semitones === 0) return chord;
    if (chord.includes('/')) {
        const parts = chord.split('/');
        return `${transposeChord(parts[0], semitones)}/${transposeChord(parts[1], semitones)}`;
    }
    const match = chord.match(/^([A-G][#b]?)(.*)/);
    if (!match) return chord;
    const flatToSharp = { 'Db': 'C#', 'Eb': 'D#', 'Gb': 'F#', 'Ab': 'G#', 'Bb': 'A#' };
    const root = flatToSharp[match[1]] || match[1];
    const idx = CHROMATIC.indexOf(root);
    if (idx === -1) return chord;
    let newIdx = (idx + semitones) % 12;
    if (newIdx < 0) newIdx += 12;
    return CHROMATIC[newIdx] + match[2];
}

const SECTION_LABELS = new Set(['verse', 'intro', 'chorus', 'bridge', 'pre-chorus', 'pre chorus', 'ending', 'prelude']);
function isSectionLabel(value) {
    return SECTION_LABELS.has(String(value || '').trim().toLowerCase().replace(/\s+/g, ' '));
}

function transposeContent(text, semitones) {
    if (!text) return text;
    const normalized = normalizeChordRows(text);
    if (semitones === 0) return normalized;
    return normalized.replace(/\[([^\]]+)\]/g, (whole, c) => {
        const chord = c.trim();
        return isSectionLabel(chord) ? whole : `[${transposeChord(chord, semitones)}]`;
    });
}

function isChordToken(token) {
    const clean = String(token || '').replace(/[|,;]/g, '').trim();
    if (isSectionLabel(clean)) return false;
    return /^(?:[A-G](?:#|b)?)(?:(?:maj|min|m|M|dim|aug|sus|add|omit|no|2|4|5|6|7|9|11|13|b5|#5|b9|#9|b13|\+|°|ø|-|\(.*\)))*(?:\/(?:[A-G](?:#|b)?))?$/.test(clean)
        || /^(?:N\.C\.|NC)$/i.test(clean);
}

function isChordOnlyLine(line) {
    const tokens = String(line || '').trim().split(/\s+/).filter(Boolean);
    return tokens.length > 0 && tokens.every(isChordToken);
}

function chordLineToInline(chordLine, lyricLine) {
    const tokens = [...String(chordLine || '').matchAll(/\S+/g)].filter(m => isChordToken(m[0]));
    let result = String(lyricLine || '');
    tokens.sort((a, b) => b.index - a.index).forEach(token => {
        const position = Math.min(token.index, result.length);
        const chord = token[0].replace(/[|,;]/g, '');
        result = result.slice(0, position) + '[' + chord + ']' + result.slice(position);
    });
    return result;
}

function normalizeChordRows(text) {
    const lines = String(text || '').replace(/\r/g, '').split('\n');
    const output = [];
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (isChordOnlyLine(line)) {
            let next = i + 1;
            while (next < lines.length && !lines[next].trim()) next++;
            if (next < lines.length && !isChordOnlyLine(lines[next]) && !/\[[^\]]+\]/.test(lines[next])) {
                output.push(chordLineToInline(line, lines[next]));
                i = next;
                continue;
            }
        }
        output.push(line);
    }
    return output.join('\n');
}

function parseLine(line) {
    if (!line.includes('[')) return { hasChords: false, chords: '', lyrics: line };
    let chordLine = '', lyricLine = '', currentIndex = 0;
    const regex = /\[([^\]]+)\]/g;
    let match;
    while ((match = regex.exec(line)) !== null) {
        const chord = match[1], matchIndex = match.index;
        lyricLine += line.slice(currentIndex, matchIndex);
        while (chordLine.length < lyricLine.length) chordLine += ' ';
        chordLine += chord;
        currentIndex = regex.lastIndex;
    }
    lyricLine += line.slice(currentIndex);
    return { hasChords: true, chords: chordLine, lyrics: lyricLine };
}

function renderLyricsHTML(text, semitones = 0, showChords = true) {
    if (!text) return '';
    const transposed = transposeContent(text, semitones);
    return transposed.split('\n').map(line => {
        const { hasChords, chords, lyrics } = parseLine(line);
        let chordHtml = '';
        if (showChords && hasChords) {
            chordHtml = `<div class="whitespace-pre font-bold text-cyan-400 text-xs sm:text-sm tracking-wide select-none min-h-[1.25rem]">` +
            chords.split(/(\S+)/).map(p => p.trim() ? `<span class="bg-cyan-500/10 border border-cyan-400/30 px-1 py-0.5 rounded text-cyan-300 mr-0.5">${p}</span>` : p).join('') +
            `</div>`;
        }
        return `<div class="leading-relaxed py-0.5">${chordHtml}<div class="whitespace-pre text-slate-100 font-sans tracking-wide text-sm sm:text-base">${lyrics || (hasChords ? '' : line)}</div></div>`;
    }).join('');
}

function handleGlobalSearch(query) {
    const container = document.getElementById('global-search-results-container');
    const grid = document.getElementById('global-search-grid');
    if (!container || !grid) return;
    if (!query.trim()) { container.classList.add('hidden'); return; }
    container.classList.remove('hidden');
    const matches = songs.filter(s => s.title.toLowerCase().includes(query.toLowerCase()) || s.singer.toLowerCase().includes(query.toLowerCase()));
    const countEl = document.getElementById('global-search-count');
    if (countEl) countEl.innerText = `Search Results (${matches.length})`;
    grid.innerHTML = matches.map(s => `
    <div onclick="alertSongLyrics('${s.id}')" class="p-4 rounded-2xl bg-slate-900/60 border border-blue-900/40 hover:border-blue-500/50 cursor-pointer flex justify-between items-center">
    <div><h4 class="font-bold text-white">${s.title}</h4><p class="text-xs text-slate-400">${s.singer} • Key: <span class="text-cyan-400 font-bold">${s.originalKey}</span></p></div>
    <span class="text-xs px-3 py-1.5 rounded-lg bg-blue-600/20 text-blue-300 font-medium">View</span>
    </div>`).join('');
    if (window.lucide) lucide.createIcons();
}

function alertSongLyrics(id) {
    const s = songs.find(x => x.id === id);
    if (s) {
        alert(`${s.title} (${s.originalKey})\n\n` + s.lyrics.replace(/\[[^\]]+\]/g, ''));
    }
}

function renderSongsBank() {
    const searchEl = document.getElementById('song-bank-search');
    const search = searchEl ? searchEl.value.toLowerCase() : '';
    const list = document.getElementById('songs-bank-list');
    if (!list) return;
    const filtered = songs.filter(s => s.title.toLowerCase().includes(search) || s.singer.toLowerCase().includes(search));

    list.innerHTML = filtered.length === 0 ? `<div class="p-12 text-center text-slate-400">No songs found.</div>` : filtered.map(s => {
        const semitones = songTranspositions[s.id] || 0;
        const currentKey = transposeChord(s.originalKey, semitones);
        const isExpanded = expandedSongId === s.id;
        return `
        <div class="rounded-2xl border transition-all overflow-hidden ${isExpanded ? 'border-cyan-400/50 bg-slate-900/90 shadow-2xl' : 'border-blue-900/40 bg-slate-900/50 shadow-lg'}">
        <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex-1 cursor-pointer flex items-center space-x-3" onclick="toggleSongExpand('${s.id}')">
        <div class="p-2 rounded-xl ${isExpanded ? 'bg-cyan-500/20 text-cyan-300' : 'bg-slate-800 text-slate-400'}"><i data-lucide="music" class="w-4 h-4"></i></div>
        <div><h3 class="text-base font-bold text-white">${s.title}</h3><p class="text-xs text-blue-300">${s.singer}</p></div>
        </div>
        <div class="flex items-center space-x-2">
        <div class="flex items-center bg-slate-950/90 border border-blue-800/60 rounded-xl px-2 py-1 space-x-1.5">
        <span class="text-[11px] text-slate-400">Key:</span>
        <span class="text-xs font-bold text-cyan-300 w-5 text-center">${currentKey}</span>
        <button onclick="changeKey('${s.id}', -1)" class="w-5 h-5 rounded bg-slate-800 text-cyan-300 text-xs">-</button>
        <button onclick="changeKey('${s.id}', 1)" class="w-5 h-5 rounded bg-slate-800 text-cyan-300 text-xs">+</button>
        </div>
        <button onclick="openSongModal('${s.id}')" class="p-1.5 rounded-xl bg-slate-800 text-slate-300"><i data-lucide="edit" class="w-4 h-4"></i></button>
        <button onclick="deleteSong('${s.id}')" class="p-1.5 rounded-xl bg-red-500/10 text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        <button onclick="toggleSongExpand('${s.id}')" class="p-1.5 rounded-xl bg-slate-800 text-slate-400"><i data-lucide="eye" class="w-4 h-4"></i></button>
        </div>
        </div>
        ${isExpanded ? `<div class="p-4 sm:p-6 border-t border-blue-900/40 bg-slate-950/70 overflow-x-auto">${renderLyricsHTML(s.lyrics, semitones, true)}</div>` : ''}
        </div>`;
    }).join('');
    if (window.lucide) lucide.createIcons();
}

function toggleSongExpand(id) {
    expandedSongId = expandedSongId === id ? null : id;
    renderSongsBank();
}

function changeKey(id, delta) {
    songTranspositions[id] = (songTranspositions[id] || 0) + delta;
    renderSongsBank();
}

function deleteSong(id) {
    if (confirm('Delete this song?')) {
        songs = songs.filter(s => s.id !== id);
        saveData();
        renderSongsBank();
    }
}

function renderLineupsView() {
    const container = document.getElementById('lineups-view-container');
    if (!container) return;
    container.innerHTML = lineups.map(l => {
        const lineupSongs = l.songIds.map(id => songs.find(s => s.id === id)).filter(Boolean);
        return `
        <div class="p-5 rounded-2xl bg-slate-900/50 border border-blue-900/40 backdrop-blur-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
        <span class="text-xs font-bold text-cyan-400">${l.date}</span> <span class="text-slate-500">•</span> <span class="text-xs text-slate-400">${l.leader || 'Team'}</span>
        <h4 class="font-bold text-white text-lg mt-0.5">${l.title}</h4>
        <p class="text-xs text-slate-400 mt-1">${lineupSongs.length} songs in playlist</p>
        </div>
        <div class="flex items-center space-x-2">
        <button onclick="startPresentation('${l.id}', 0)" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold flex items-center space-x-1.5"><i data-lucide="play" class="w-4 h-4 fill-current"></i><span>Launch</span></button>
        <button onclick="editLineup('${l.id}')" title="Edit lineup" aria-label="Edit lineup" class="p-2 rounded-xl bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
        <button onclick="deleteLineup('${l.id}')" title="Delete lineup" aria-label="Delete lineup" class="p-2 rounded-xl bg-red-500/10 text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
        </div>`;
    }).join('');
    if (window.lucide) lucide.createIcons();
}

function deleteLineup(id) {
    if (confirm('Delete lineup?')) {
        lineups = lineups.filter(l => l.id !== id);
        saveData();
        renderLineupsView();
    }
}

function startPresentation(lineupId, songIdx) {
    currentStageLineup = lineups.find(l => l.id === lineupId);
    if (!currentStageLineup) return;
    currentStageSongIdx = songIdx;
    stageTranspositions = currentStageLineup.transpositions || {};
    const modal = document.getElementById('presentation-modal');
    if (modal) modal.classList.remove('hidden');
    renderStage();
}

function renderStage() {
    if (!currentStageLineup) return;
    const titleEl = document.getElementById('stage-lineup-title');
    const leaderEl = document.getElementById('stage-lineup-leader');
    if (titleEl) titleEl.innerText = currentStageLineup.title;
    if (leaderEl) leaderEl.innerText = `Leader: ${currentStageLineup.leader || 'Team'}`;

    const pillsEl = document.getElementById('stage-song-pills');
    if (pillsEl) {
        pillsEl.innerHTML = currentStageLineup.songIds.map((sId, idx) => {
            const s = songs.find(x => x.id === sId);
            if (!s) return '';
            const active = idx === currentStageSongIdx;
            return `<button onclick="currentStageSongIdx=${idx}; renderStage();" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${active ? 'bg-gradient-to-r from-blue-600 to-cyan-500 text-white' : 'bg-slate-900 border border-slate-800 text-slate-400'}">${idx+1}. ${s.title}</button>`;
        }).join('');
    }

    const currentSongId = currentStageLineup.songIds[currentStageSongIdx];
    const song = songs.find(s => s.id === currentSongId);
    if (!song) return;

    const semitones = stageTranspositions[currentSongId] || 0;
    const songTitleEl = document.getElementById('stage-song-title');
    const songSingerEl = document.getElementById('stage-song-singer');
    const songKeyEl = document.getElementById('stage-song-key');
    const lyricsBoxEl = document.getElementById('stage-lyrics-box');
    const trackCounterEl = document.getElementById('stage-track-counter');

    if (songTitleEl) songTitleEl.innerText = song.title;
    if (songSingerEl) songSingerEl.innerText = song.singer;
    if (songKeyEl) songKeyEl.innerText = transposeChord(song.originalKey, semitones);
    if (lyricsBoxEl) lyricsBoxEl.innerHTML = renderLyricsHTML(song.lyrics, semitones, showStageChords);
    if (trackCounterEl) trackCounterEl.innerText = `Track ${currentStageSongIdx + 1} of ${currentStageLineup.songIds.length}`;

    const prevBtn = document.getElementById('stage-prev-btn');
    const nextBtn = document.getElementById('stage-next-btn');
    if (prevBtn) prevBtn.disabled = currentStageSongIdx === 0;
    if (nextBtn) nextBtn.disabled = currentStageSongIdx === currentStageLineup.songIds.length - 1;
    if (window.lucide) lucide.createIcons();
}

function navigateStageSong(delta) {
    currentStageSongIdx += delta;
    renderStage();
}

function adjustStageKey(delta) {
    const currentSongId = currentStageLineup.songIds[currentStageSongIdx];
    stageTranspositions[currentSongId] = (stageTranspositions[currentSongId] || 0) + delta;
    renderStage();
}

function toggleStageChords() {
    showStageChords = !showStageChords;
    const btn = document.getElementById('stage-chords-btn');
    if (btn) {
        btn.className = showStageChords ? 'px-2.5 py-1.5 rounded-xl border text-xs font-semibold flex items-center space-x-1 bg-cyan-500/20 border-cyan-400 text-cyan-300' : 'px-2.5 py-1.5 rounded-xl border text-xs font-semibold flex items-center space-x-1 bg-slate-800 border-slate-700 text-slate-400';
        btn.innerHTML = `<i data-lucide="eye" class="w-3.5 h-3.5"></i><span>${showStageChords ? 'Chords On' : 'Chords Off'}</span>`;
    }
    renderStage();
}

function exitPresentation() {
    const modal = document.getElementById('presentation-modal');
    if (modal) modal.classList.add('hidden');
}

function searchSongOnGoogle() {
    const titleInput = document.getElementById('form-song-title');
    const singerInput = document.getElementById('form-song-singer');
    const statusEl = document.getElementById('song-import-status');
    if (!titleInput) return;
    const title = titleInput.value.trim();
    const singer = singerInput ? singerInput.value.trim() : '';
    if (!title) {
        alert('Enter the song title first, then search Google.');
        titleInput.focus();
        return;
    }
    const query = [title, singer, 'lyrics chords'].filter(Boolean).join(' ');
    const url = 'https://www.google.com/search?q=' + encodeURIComponent(query);
    window.open(url, '_blank', 'noopener,noreferrer');
    if (statusEl) statusEl.textContent = 'Google search opened in a new tab. Copy the lyrics or chord sheet from a source you are permitted to use, then paste it here.';
}

function formatImportedSongText(rawText, mode) {
    const lines = String(rawText || '').replace(/\r/g, '').split('\n');
    const output = [];
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (mode === 'chords' && isChordOnlyLine(line) && i + 1 < lines.length && lines[i + 1].trim()) {
            output.push(chordLineToInline(line, lines[i + 1]));
            i++;
            continue;
        }
        if (mode === 'lyrics' && isChordOnlyLine(line)) continue;
        let cleaned = line;
        if (mode === 'lyrics') cleaned = cleaned.replace(/\[[^\]]+\]/g, '').replace(/\s{2,}/g, ' ').trimEnd();
        output.push(cleaned);
    }
    return output.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function importSongText(mode) {
    const importTextEl = document.getElementById('song-import-text');
    const lyricsField = document.getElementById('form-song-lyrics');
    const statusEl = document.getElementById('song-import-status');
    if (!importTextEl || !lyricsField) return;
    const raw = importTextEl.value.trim();
    if (!raw) {
        alert('Paste the song text into the import box first.');
        return;
    }
    const formatted = formatImportedSongText(raw, mode);
    if (!formatted) {
        alert('No usable song text was found.');
        return;
    }
    if (lyricsField.value.trim() && !confirm('Replace the lyrics currently in the song editor with the imported text?')) return;
    lyricsField.value = formatted;
    if (statusEl) {
        statusEl.textContent = mode === 'lyrics'
            ? 'Imported lyrics only. Chord symbols were removed.'
            : 'Imported lyrics with chord markers.';
    }
    lyricsField.focus();
}

function openSongModal(id = null) {
    const editIdEl = document.getElementById('edit-song-id');
    const importTextEl = document.getElementById('song-import-text');
    const statusEl = document.getElementById('song-import-status');
    const modalTitleEl = document.getElementById('song-modal-title');
    const titleEl = document.getElementById('form-song-title');
    const singerEl = document.getElementById('form-song-singer');
    const keyEl = document.getElementById('form-song-key');
    const tempoEl = document.getElementById('form-song-tempo');
    const lyricsEl = document.getElementById('form-song-lyrics');
    const modalEl = document.getElementById('song-modal');

    if (editIdEl) editIdEl.value = id || '';
    if (importTextEl) importTextEl.value = '';
    if (statusEl) statusEl.textContent = 'Google results open in a new tab. Copy text from a source you have permission to use, return here, and paste it above.';
    
    if (id) {
        const s = songs.find(x => x.id === id);
        if (s) {
            if (modalTitleEl) modalTitleEl.innerText = 'Edit Song';
            if (titleEl) titleEl.value = s.title;
            if (singerEl) singerEl.value = s.singer;
            if (keyEl) keyEl.value = s.originalKey;
            if (tempoEl) tempoEl.value = s.tempo || '';
            if (lyricsEl) lyricsEl.value = s.lyrics;
        }
    } else {
        if (modalTitleEl) modalTitleEl.innerText = 'Add New Song';
        if (titleEl) titleEl.value = '';
        if (singerEl) singerEl.value = '';
        if (keyEl) keyEl.value = 'C';
        if (tempoEl) tempoEl.value = '';
        if (lyricsEl) lyricsEl.value = '';
    }
    if (modalEl) modalEl.classList.remove('hidden');
}

function closeSongModal() {
    const modal = document.getElementById('song-modal');
    if (modal) modal.classList.add('hidden');
}

function saveSongForm(e) {
    e.preventDefault();
    const editIdEl = document.getElementById('edit-song-id');
    const titleEl = document.getElementById('form-song-title');
    const singerEl = document.getElementById('form-song-singer');
    const keyEl = document.getElementById('form-song-key');
    const tempoEl = document.getElementById('form-song-tempo');
    const lyricsEl = document.getElementById('form-song-lyrics');
    if (!editIdEl || !titleEl) return;

    const id = editIdEl.value;
    const data = {
        title: titleEl.value,
        singer: singerEl ? singerEl.value : '',
        originalKey: keyEl ? keyEl.value : 'C',
        tempo: tempoEl ? tempoEl.value : '',
        lyrics: lyricsEl ? lyricsEl.value : ''
    };
    if (id) {
        songs = songs.map(s => s.id === id ? { ...s, ...data } : s);
    } else {
        songs.unshift({ id: 's_' + Date.now(), ...data, createdAt: new Date().toISOString().split('T')[0] });
    }
    saveData();
    closeSongModal();
    renderSongsBank();
}

function renderLineupSongSelection() {
    const container = document.getElementById('lineup-songs-checkboxes');
    if (!container) return;
    const selected = new Set(lineupDraftSongIds);

    const songChoices = songs.map(s => `
        <label class="flex items-center justify-between gap-3 p-2 rounded-lg bg-slate-900 border border-slate-800 text-xs cursor-pointer hover:border-blue-700/60">
            <span class="min-w-0"><span class="font-semibold text-slate-200">${s.title}</span><span class="text-slate-500"> (${s.singer || 'Unknown artist'})</span></span>
            <input type="checkbox" name="lineup-song" value="${s.id}" ${selected.has(s.id) ? 'checked' : ''}
                onchange="toggleLineupSong('${s.id}', this.checked)"
                class="rounded bg-slate-950 border-slate-700 text-cyan-500">
        </label>`).join('');

    const orderedSongs = lineupDraftSongIds.map((id, index) => {
        const song = songs.find(s => s.id === id);
        if (!song) return '';
        return `
        <div class="flex items-center gap-2 p-2.5 rounded-xl bg-blue-950/40 border border-blue-800/50">
            <span class="w-7 h-7 flex items-center justify-center rounded-lg bg-blue-600/20 text-cyan-300 text-xs font-bold">${index + 1}</span>
            <div class="flex-1 min-w-0">
                <p class="text-xs font-semibold text-white truncate">${song.title}</p>
                <p class="text-[10px] text-slate-400 truncate">${song.singer || 'Unknown artist'}</p>
            </div>
            <button type="button" onclick="moveLineupSong('${id}', -1)" ${index === 0 ? 'disabled' : ''}
                title="Move up" class="p-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed"><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
            <button type="button" onclick="moveLineupSong('${id}', 1)" ${index === lineupDraftSongIds.length - 1 ? 'disabled' : ''}
                title="Move down" class="p-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed"><i data-lucide="arrow-down" class="w-4 h-4"></i></button>
        </div>`;
    }).join('');

    container.innerHTML = `
        <div class="space-y-2">
            <p class="text-[11px] text-slate-400">Choose songs below. Their final presentation order is shown here; use the arrows to rearrange them.</p>
            <div class="space-y-1.5">${songChoices || '<p class="text-xs text-slate-500 p-2">No songs in the song bank yet.</p>'}</div>
        </div>
        <div class="mt-4 pt-4 border-t border-slate-800 space-y-2">
            <div class="flex items-center justify-between">
                <p class="text-[11px] font-bold uppercase tracking-wider text-cyan-300">Final song order</p>
                <span class="text-[10px] text-slate-500">${lineupDraftSongIds.length} selected</span>
            </div>
            <div class="space-y-1.5">${orderedSongs || '<p class="text-xs text-slate-500 p-3 rounded-xl bg-slate-900/60">Select one or more songs to build the lineup.</p>'}</div>
        </div>`;
    if (window.lucide) lucide.createIcons();
}

function toggleLineupSong(id, checked) {
    if (checked && !lineupDraftSongIds.includes(id)) lineupDraftSongIds.push(id);
    if (!checked) lineupDraftSongIds = lineupDraftSongIds.filter(songId => songId !== id);
    renderLineupSongSelection();
}

function moveLineupSong(id, direction) {
    const index = lineupDraftSongIds.indexOf(id);
    const target = index + direction;
    if (index < 0 || target < 0 || target >= lineupDraftSongIds.length) return;
    [lineupDraftSongIds[index], lineupDraftSongIds[target]] = [lineupDraftSongIds[target], lineupDraftSongIds[index]];
    renderLineupSongSelection();
}

function openLineupModal() {
    editingLineupId = null;
    lineupDraftSongIds = [];
    const modalTitleEl = document.getElementById('lineup-modal-title');
    const submitBtnEl = document.getElementById('lineup-submit-btn');
    const titleEl = document.getElementById('form-lineup-title');
    const dateEl = document.getElementById('form-lineup-date');
    const leaderEl = document.getElementById('form-lineup-leader');
    const notesEl = document.getElementById('form-lineup-notes');
    const modalEl = document.getElementById('lineup-modal');

    if (modalTitleEl) modalTitleEl.innerText = 'Create Service Lineup';
    if (submitBtnEl) submitBtnEl.innerText = 'Create Lineup';
    if (titleEl) titleEl.value = '';
    if (dateEl) dateEl.value = new Date().toISOString().split('T')[0];
    if (leaderEl) leaderEl.value = '';
    if (notesEl) notesEl.value = '';
    renderLineupSongSelection();
    if (modalEl) modalEl.classList.remove('hidden');
}

function editLineup(id) {
    const lineup = lineups.find(item => item.id === id);
    if (!lineup) return;

    editingLineupId = id;
    lineupDraftSongIds = [...(lineup.songIds || [])].filter(songId => songs.some(s => s.id === songId));
    const modalTitleEl = document.getElementById('lineup-modal-title');
    const submitBtnEl = document.getElementById('lineup-submit-btn');
    const titleEl = document.getElementById('form-lineup-title');
    const dateEl = document.getElementById('form-lineup-date');
    const leaderEl = document.getElementById('form-lineup-leader');
    const notesEl = document.getElementById('form-lineup-notes');
    const modalEl = document.getElementById('lineup-modal');

    if (modalTitleEl) modalTitleEl.innerText = 'Edit Service Lineup';
    if (submitBtnEl) submitBtnEl.innerText = 'Save Changes';
    if (titleEl) titleEl.value = lineup.title || '';
    if (dateEl) dateEl.value = lineup.date || '';
    if (leaderEl) leaderEl.value = lineup.leader || '';
    if (notesEl) notesEl.value = lineup.notes || '';
    renderLineupSongSelection();
    if (modalEl) modalEl.classList.remove('hidden');
}

function closeLineupModal() {
    const modal = document.getElementById('lineup-modal');
    if (modal) modal.classList.add('hidden');
    editingLineupId = null;
}

function saveLineupForm(e) {
    e.preventDefault();
    if (lineupDraftSongIds.length === 0) {
        alert('Select at least one song.');
        return;
    }

    const titleEl = document.getElementById('form-lineup-title');
    const dateEl = document.getElementById('form-lineup-date');
    const leaderEl = document.getElementById('form-lineup-leader');
    const notesEl = document.getElementById('form-lineup-notes');

    const data = {
        title: titleEl ? titleEl.value.trim() : '',
        date: dateEl ? dateEl.value : '',
        leader: leaderEl ? leaderEl.value.trim() : '',
        notes: notesEl ? notesEl.value.trim() : '',
        songIds: [...lineupDraftSongIds]
    };

    if (editingLineupId) {
        lineups = lineups.map(lineup => lineup.id === editingLineupId
            ? { ...lineup, ...data, transpositions: lineup.transpositions || {} }
            : lineup);
    } else {
        lineups.unshift({
            id: 'l_' + Date.now(),
            ...data,
            transpositions: {}
        });
    }

    saveData();
    closeLineupModal();
    renderLineupsView();
}

window.onload = async () => {
    await loadSharedData();
    renderHome();
    if (window.lucide) lucide.createIcons();
    startSharedSync();
};
</script>
</body>
