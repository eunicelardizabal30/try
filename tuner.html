
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar & Bass Tuner</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10131b;
    color: #fff;
}

.tuner {
    width: 100%;
    max-width: 650px;
    margin: 35px auto;
    padding: 25px;
    background: #191e29;
    border: 1px solid #303746;
    border-radius: 20px;
    text-align: center;
}

h1 { margin: 0 0 8px; font-size: 27px; }
.subtitle { color: #9ca7b8; font-size: 14px; }

.modes {
    display: flex;
    gap: 10px;
    margin: 25px 0 15px;
}

button, select {
    font: inherit;
}

.modes button {
    flex: 1;
    padding: 13px;
    border: 1px solid #394354;
    border-radius: 10px;
    color: #fff;
    background: #252d3b;
    cursor: pointer;
}

.modes button.active {
    background: #247b58;
    border-color: #39c98a;
}

select {
    width: 100%;
    padding: 13px;
    margin-bottom: 20px;
    background: #252d3b;
    color: white;
    border: 1px solid #394354;
    border-radius: 10px;
}

.note {
    font-size: 76px;
    font-weight: bold;
    margin: 10px 0 0;
    line-height: 1.2;
}

.frequency {
    color: #a9b5c7;
    font-size: 16px;
}

.status {
    font-size: 18px;
    font-weight: bold;
    margin: 12px 0 20px;
    color: #f2bd56;
}

.meter {
    position: relative;
    height: 115px;
    max-width: 440px;
    margin: 20px auto;
    overflow: hidden;
}

.meter::before {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    border: 13px solid #384354;
    border-bottom-color: transparent;
    border-radius: 50%;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
}

.center-mark {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 3px;
    height: 23px;
    background: #43df9a;
    transform: translateX(-50%);
}

.needle {
    position: absolute;
    width: 4px;
    height: 95px;
    background: #f5c15b;
    left: 50%;
    bottom: 0;
    transform-origin: bottom center;
    transform: translateX(-50%) rotate(0deg);
    border-radius: 5px;
    transition: transform .12s ease;
}

.scale {
    display: flex;
    justify-content: space-between;
    max-width: 440px;
    margin: 0 auto;
    color: #9ca7b8;
    font-size: 13px;
}

.scale span:nth-child(3) {
    color: #43df9a;
    font-weight: bold;
}

.tune-button {
    width: 100%;
    padding: 16px;
    margin-top: 25px;
    border: 0;
    border-radius: 12px;
    background: #28a873;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.tune-button:hover { background: #32bd84; }

.tune-button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.strings {
    display: flex;
    justify-content: center;
    gap: 9px;
    flex-wrap: wrap;
    margin-top: 23px;
}

.strings button {
    padding: 10px 14px;
    background: #252d3b;
    border: 1px solid #394354;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

.strings button.selected {
    background: #247b58;
    border-color: #43df9a;
}

.message {
    margin-top: 18px;
    color: #a9b5c7;
    font-size: 13px;
    line-height: 1.5;
}

@media(max-width:480px) {
    .tuner { margin: 0; padding: 22px 15px; border-radius: 0; }
    .note { font-size: 65px; }
}
</style>
</head>
<body>

<div class="tuner">
    <h1>🎸 Guitar & Bass Tuner</h1>
    <div class="subtitle">Accurate real-time chromatic tuner</div>

    <div class="modes">
        <button class="active" id="guitarBtn" onclick="setMode('guitar')">Guitar</button>
        <button id="bassBtn" onclick="setMode('bass')">Bass</button>
        <button id="chromaticBtn" onclick="setMode('chromatic')">Chromatic</button>
    </div>

    <select id="preset" onchange="changePreset()">
        <option value="standard">Standard Tuning</option>
        <option value="dropd">Drop D</option>
        <option value="dstandard">D Standard</option>
        <option value="eb">Eb Standard</option>
    </select>

    <div class="note" id="note">--</div>
    <div class="frequency" id="frequency">0.00 Hz</div>
    <div class="status" id="status">Ready to tune</div>

    <div class="meter">
        <div class="needle" id="needle"></div>
        <div class="center-mark"></div>
    </div>

    <div class="scale">
        <span>-50¢</span>
        <span>-25¢</span>
        <span>0</span>
        <span>+25¢</span>
        <span>+50¢</span>
    </div>

    <div class="strings" id="strings"></div>

    <button class="tune-button" id="startBtn" onclick="toggleTuner()">
        Start Tuner
    </button>

    <div class="message" id="message">
        Allow microphone access when prompted. Play one string at a time.
    </div>
</div>

<script>
const noteNames = [
    "C", "C#", "D", "D#", "E", "F",
    "F#", "G", "G#", "A", "A#", "B"
];

const tunings = {
    guitar: {
        standard: ["E2","A2","D3","G3","B3","E4"],
        dropd: ["D2","A2","D3","G3","B3","E4"],
        dstandard: ["D2","G2","C3","F3","A3","D4"],
        eb: ["Eb2","Ab2","Db3","Gb3","Bb3","Eb4"]
    },
    bass: {
        standard: ["E1","A1","D2","G2"],
        dropd: ["D1","A1","D2","G2"],
        dstandard: ["D1","G1","C2","F2"],
        eb: ["Eb1","Ab1","Db2","Gb2"]
    }
};

let mode = "guitar";
let active = false;
let audioContext, analyser, source, stream, animation;
let selectedString = null;
let currentTargets = [];

function frequencyFromNote(note) {
    const match = note.match(/^([A-G]#?b?)(-?\d+)$/);
    if (!match) return null;

    let name = match[1];
    let octave = Number(match[2]);

    const map = {
        C:0, "C#":1, Db:1, D:2, "D#":3, Eb:3,
        E:4, F:5, "F#":6, Gb:6, G:7,
        "G#":8, Ab:8, A:9, "A#":10, Bb:10, B:11
    };

    let midi = (octave + 1) * 12 + map[name];
    return 440 * Math.pow(2, (midi - 69) / 12);
}

function getNoteFromFrequency(freq) {
    const midi = Math.round(69 + 12 * Math.log2(freq / 440));
    const cents = 1200 * Math.log2(
        freq / (440 * Math.pow(2, (midi - 69) / 12))
    );

    return {
        name: noteNames[(midi % 12 + 12) % 12],
        octave: Math.floor(midi / 12) - 1,
        cents,
        midi
    };
}

function setMode(newMode) {
    mode = newMode;
    selectedString = null;

    document.querySelectorAll(".modes button").forEach(b =>
        b.classList.remove("active")
    );

    document.getElementById(
        newMode + "Btn"
    ).classList.add("active");

    const preset = document.getElementById("preset");

    if (mode === "chromatic") {
        preset.style.display = "none";
    } else {
        preset.style.display = "block";
    }

    updateStrings();
    resetDisplay();
}

function updateStrings() {
    const container = document.getElementById("strings");
    container.innerHTML = "";

    if (mode === "chromatic") return;

    const tuning = tunings[mode][
        document.getElementById("preset").value
    ];

    currentTargets = tuning.map(note => ({
        note,
        frequency: frequencyFromNote(note)
    }));

    tuning.forEach((note, index) => {
        const button = document.createElement("button");
        button.textContent = note;
        button.onclick = () => {
            selectedString = index;
            updateStrings();
        };

        if (selectedString === index) {
            button.classList.add("selected");
        }

        container.appendChild(button);
    });
}

function changePreset() {
    selectedString = null;
    updateStrings();
    resetDisplay();
}

function resetDisplay() {
    document.getElementById("note").textContent = "--";
    document.getElementById("frequency").textContent = "0.00 Hz";
    document.getElementById("status").textContent = "Ready to tune";
    document.getElementById("needle").style.transform =
        "translateX(-50%) rotate(0deg)";
}

async function toggleTuner() {
    if (active) {
        stopTuner();
        return;
    }

    if (!navigator.mediaDevices?.getUserMedia) {
        document.getElementById("message").textContent =
            "Microphone requires HTTPS or localhost.";
        return;
    }

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            }
        });

        audioContext = new (
            window.AudioContext || window.webkitAudioContext
        )();

        if (audioContext.state === "suspended") {
            await audioContext.resume();
        }

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 8192;

        source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        active = true;

        document.getElementById("startBtn").textContent = "Stop Tuner";
        document.getElementById("message").textContent =
            "Listening... Play one string at a time.";

        detectPitch();

    } catch (error) {
        document.getElementById("message").textContent =
            "Microphone access failed. Please allow microphone permissions.";
    }
}

function stopTuner() {
    active = false;
    cancelAnimationFrame(animation);

    if (stream) stream.getTracks().forEach(track => track.stop());
    if (audioContext) audioContext.close();

    document.getElementById("startBtn").textContent = "Start Tuner";
    document.getElementById("message").textContent =
        "Tuner stopped. Press Start Tuner to begin again.";

    resetDisplay();
}

function autoCorrelate(buffer, sampleRate) {
    let size = buffer.length;
    let rms = 0;

    for (let i = 0; i < size; i++) {
        rms += buffer[i] * buffer[i];
    }

    rms = Math.sqrt(rms / size);

    if (rms < 0.008) return -1;

    let bestOffset = -1;
    let bestCorrelation = 0;
    let correlations = new Float32Array(size);

    for (let offset = 0; offset < size / 2; offset++) {
        let correlation = 0;

        for (let i = 0; i < size / 2; i++) {
            correlation += Math.abs(
                buffer[i] - buffer[i + offset]
            );
        }

        correlation = 1 - correlation / (size / 2);
        correlations[offset] = correlation;

        if (correlation > bestCorrelation) {
            bestCorrelation = correlation;
            bestOffset = offset;
        }
    }

    if (bestOffset < 1 || bestCorrelation < 0.85) return -1;

    let shift = 0;
    const left = correlations[bestOffset - 1];
    const center = correlations[bestOffset];
    const right = correlations[bestOffset + 1];

    const denominator = 2 * (2 * center - left - right);

    if (denominator) {
        shift = (right - left) / denominator;
    }

    return sampleRate / (bestOffset + shift);
}

function detectPitch() {
    if (!active) return;

    const buffer = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buffer);

    const pitch = autoCorrelate(
        buffer,
        audioContext.sampleRate
    );

    if (pitch > 25 && pitch < 1500) {
        displayPitch(pitch);
    }

    animation = requestAnimationFrame(detectPitch);
}

function displayPitch(freq) {
    const detected = getNoteFromFrequency(freq);

    let targetFrequency;
    let targetNote;

    if (mode === "chromatic") {
        targetNote = detected.name + detected.octave;
        targetFrequency = frequencyFromNote(targetNote);
    } else {
        let targets = currentTargets;

        if (selectedString !== null) {
            targets = [currentTargets[selectedString]];
        }

        let closest = targets.reduce((best, current) =>
            Math.abs(1200 * Math.log2(freq / current.frequency)) <
            Math.abs(1200 * Math.log2(freq / best.frequency))
                ? current : best
        );

        targetFrequency = closest.frequency;
        targetNote = closest.note;
    }

    if (!targetFrequency) return;

    const cents = 1200 * Math.log2(freq / targetFrequency);

    document.getElementById("note").textContent = detected.name;
    document.getElementById("frequency").textContent =
        freq.toFixed(2) + " Hz";

    const status = document.getElementById("status");
    const needle = document.getElementById("needle");

    let angle = Math.max(-45, Math.min(45, cents * 0.9));

    needle.style.transform =
        `translateX(-50%) rotate(${angle}deg)`;

    if (Math.abs(cents) <= 5) {
        status.textContent = "✓ IN TUNE";
        status.style.color = "#43df9a";
        needle.style.background = "#43df9a";
    } else if (cents < 0) {
        status.textContent = "♭ TOO FLAT";
        status.style.color = "#f2bd56";
        needle.style.background = "#f2bd56";
    } else {
        status.textContent = "♯ TOO SHARP";
        status.style.color = "#f2bd56";
        needle.style.background = "#f2bd56";
    }

    document.getElementById("frequency").textContent =
        freq.toFixed(2) + " Hz  |  " +
        (cents > 0 ? "+" : "") + cents.toFixed(1) + " cents";
}

updateStrings();
</script>
</body>
</html>
